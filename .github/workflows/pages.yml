# Publishes the documentation site with GitHub Pages, at
# skein.chasingdaylight.dev: docs/, with skein's own requirements rendered by
# skein (tools/site.sh), turned into pages by GitHub Pages' Jekyll until skein
# renders HTML itself.
#
# The site has an edition of each earlier release under vX.Y.Z/, built from
# its tag, and lists them on every page (#260; tools/site.sh).
#
# Runs on every push to main, and by hand (Actions > Documentation site > Run
# workflow). A mirror with its own domain builds the same site from this
# repository with the same script; see docs/design.md, section 8.
name: Documentation site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the site (else only build it, to check it)
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  ZIG_VERSION: 0.17.1

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: randyos-org/setup-zig@node24  # v2.2.1 on Node.js 24, until upstream releases it
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build skein
        run: zig build

      - name: Put the site's source together
        run: bash tools/site.sh .site/src

      - name: Build the pages
        uses: actions/jekyll-build-pages@v1
        with:
          source: .site/src
          destination: ./_site

      # the site is served under more than one domain: no page may name one
      - name: No page names a domain of the site
        run: |
          if grep -rIl -e 'chasingdaylight\.dev' -e 'randyeckman\.com' _site; then
            echo "::error::these pages name a domain the site is served under"
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    name: Publish
    needs: build
    if: ${{ github.event_name == 'push' || inputs.publish }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # The mirror is another repository's Pages site, under another domain,
  # which builds this repository itself. A commit there starts its build and
  # records what it built. It is made with a deploy key that can write to
  # that repository and nothing else (the secret MIRROR_DEPLOY_KEY).
  mirror:
    name: Start the mirror's build
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          repository: emanspeaks/skein-docs
          ssh-key: ${{ secrets.MIRROR_DEPLOY_KEY }}

      - name: Record the commit to build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$GITHUB_SHA" > source.txt
          git add source.txt
          if git diff --cached --quiet; then
            echo "The mirror already has this commit."
            exit 0
          fi
          git commit -q -m "Build chasingdaylight/skein@${GITHUB_SHA::7}"
          git push -q
