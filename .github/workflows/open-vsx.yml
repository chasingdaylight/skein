# Publishes a release's VS Code extension package to Open VSX, as zfls's and
# vscode-cesium's open-vsx.yml do.
#
# Open VSX trusts a workflow by its file name (trusted publishing for the
# `chasingdaylight` namespace): it accepts the OIDC token of a run of
# `open-vsx.yml` in this repository, so no stored token is needed. That can
# be set up only once the extension exists and the namespace is claimed, so
# the first versions are published with the OVSX_PAT secret, which stays as
# the fallback afterwards. The CI workflow starts this after publishing a
# release; it can also be run by hand (Actions > Publish to Open VSX > Run
# workflow, on main) to publish, or finish publishing, any released version.
#
# From v0.2.1 every version is a release, not a pre-release (emanspeaks,
# 2026-11-27). Open VSX reads that from the package as it was made (`vsce
# package`, without `--pre-release`).
name: Publish to Open VSX

on:
  workflow_dispatch:
    inputs:
      version:
        description: Released version to publish, without the v (e.g. 0.1.0)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: open-vsx-${{ inputs.version }}
  cancel-in-progress: false

env:
  OVSX_VERSION: 1.4.0
  NODE_VERSION: 24

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish chasingdaylight.skein v${{ inputs.version }} to Open VSX
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The platform packages, each with its skein, as zfls publishes; the
      # universal package goes to the Marketplace only. A release without
      # platform packages (v0.1.0) has its one package published here.
      - name: Download the release's extension packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --dir dist --pattern "skein-vscode-v$VERSION*.vsix"
          universal="dist/skein-vscode-v$VERSION-universal.vsix"
          if ls dist/*.vsix | grep -qvxF "$universal"; then
            rm -f "$universal"
          fi
          ls dist

      # --skip-duplicate: a version already published counts as published,
      # so a run can simply be repeated
      - name: Publish
        env:
          # the first publication, and the fallback when trust is refused
          OPENVSX_TOKEN: ${{ secrets.OVSX_PAT }}
        run: |
          ovsx() { npx --yes "ovsx@$OVSX_VERSION" "$@"; }
          failed=0
          for vsix in dist/*.vsix; do
            if ovsx publish "$vsix" --trusted-publishing --skip-duplicate; then
              continue
            fi
            if [ -n "$OPENVSX_TOKEN" ]; then
              echo "::warning::trusted publishing of $vsix was refused; publishing with the OVSX_PAT secret"
              OVSX_PAT="$OPENVSX_TOKEN" ovsx publish "$vsix" --skip-duplicate && continue
            fi
            echo "::error::publishing $vsix failed"
            failed=1
          done
          exit "$failed"
