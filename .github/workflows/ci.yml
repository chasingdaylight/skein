name: CI

# Modeled on zfls's and rstd's ci.yml. Every pull request into main and every
# push to main runs the unit tests on each platform, and checks zig fmt and
# the Markdown. Pushes to dev and pull requests into it are not run: dev is
# checked as a whole by the pull request that releases it (to main), which
# each merge into dev restarts; start the workflow by hand on a branch to
# check it alone (`gh workflow run CI --ref <branch>`). A pull request that
# only changes documentation (docs-only.txt) is linted and tested on one
# platform, and not packaged. A pull request that
# only changes the files listed in no-ci.txt (the license, editor settings)
# skips the checks; the "CI" job, the check main's ruleset requires, passes
# then too.
#
# A push to main of a version (build.zig.zon) that has no tag yet is released,
# when something a release ships has changed since the last one (changes.sh):
# the commit is tagged, a GitHub release gets skein for each platform and the
# VS Code extension, the extension is published to the Marketplace and to Open
# VSX (marketplace.yml, open-vsx.yml), and the next version is begun on dev.
#
# Signing (#235), as zfls's ci.yml does it: only a release, and a run started
# by hand with the `sign` input, signs the programs (never a pull request:
# signings are limited per month). compile builds them unsigned; sign-windows
# signs skein.exe (Azure Artifact Signing), sign-macos signs and notarizes the
# macOS skein (Developer ID), pkg-macos makes the macOS installer package;
# package then archives the signed programs and makes the VS Code packages
# from them. Each signing job is skipped while its configuration is unset
# (SIGN_AZURE_CLIENT_ID and the other SIGN_* variables; APPLE_SIGNING,
# APPLE_PKG and the APPLE_* secrets), and the programs stay unsigned; a
# signing job that fails fails the run.

on:
  push:
    # (not dev: see the top)
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sign:
        description: Sign and notarize the programs, as a release does
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: 24
  # 4.1.0 is the first release with --oidc; marketplace.yml uses the same
  VSCE_VERSION: 4.1.1
  ZIG_VERSION: 0.17.1

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    outputs:
      ci: ${{ steps.changes.outputs.ci }}
      scope: ${{ steps.changes.outputs.scope }}
      platforms: ${{ steps.changes.outputs.platforms }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out what changed
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # matches, no_ci, docs_only
          source .github/workflows/changes.sh

          # A pull request that only changes files of no-ci.txt skips CI.
          # One that only changes documentation (docs-only.txt) is linted
          # and tested on one platform, since the tests read the
          # requirements, and is not packaged. Pushes to main and runs
          # started by hand always run everything.
          ci=true
          scope=full
          if [ "$EVENT" = pull_request ]; then
            ci=false
            scope=docs
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              if matches "$f" "${no_ci[@]}"; then continue; fi
              ci=true
              case "$f" in
                # the extension's files are in its package, its readme too
                editors/vscode/*) scope=full ;;
                # the templates are built into skein, their Markdown too
                templates/*) scope=full ;;
                *) matches "$f" "${docs_only[@]}" || scope=full ;;
              esac
              if [ "$scope" = full ]; then echo "changed: $f"; break; fi
            done <<< "$(git diff --name-only "$BASE_SHA...HEAD")"
          fi
          if [ "$scope" = full ]; then
            platforms='["ubuntu-24.04","ubuntu-24.04-arm","windows-2025","macos-15","macos-15-intel"]'
          else
            platforms='["ubuntu-24.04"]'
          fi
          {
            echo "ci=$ci"
            echo "scope=$scope"
            echo "platforms=$platforms"
          } >> "$GITHUB_OUTPUT"
          if [ "$ci" = false ]; then
            echo "Only files of no-ci.txt changed; skipping the checks." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$scope" = docs ]; then
            echo "Only documentation changed: lint, and the tests on one platform." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  # The version, from build.zig.zon, and whether this run releases it: a push
  # to main of a version that has no tag yet.
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      sign: ${{ steps.version.outputs.sign }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SIGN: ${{ inputs.sign }}
          SIGN_WINDOWS: ${{ vars.SIGN_AZURE_CLIENT_ID }}
          SIGN_MACOS: ${{ vars.APPLE_SIGNING }}
        run: |
          # every place that states the version agrees (version.sh lists them)
          if ! version=$(bash .github/workflows/version.sh); then
            echo "::error::the places that state the version disagree; see the log, and set them all with version.sh set"
            exit 1
          fi
          release=false
          if [ "$EVENT" = push ] && [ "$GITHUB_REF" = refs/heads/main ] \
            && ! git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            # matches, exempt, shipped_changes
            source .github/workflows/changes.sh
            last=$(git describe --tags --abbrev=0 --match 'v*' 2> /dev/null || true)
            if [ -z "$last" ]; then
              release=true
            else
              shipped=$(shipped_changes "$last")
              if [ -n "$shipped" ]; then
                release=true
                { echo "Changed since $last:"; echo "$shipped" | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
              else
                echo "Nothing that a release ships has changed since $last: no release." | tee -a "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi
          # signing: for a release, or a run started by hand that asks, when
          # a platform's signing is configured
          sign=false
          if [ "$release" = true ] || { [ "$EVENT" = workflow_dispatch ] && [ "$INPUT_SIGN" = true ]; }; then
            if [ -n "$SIGN_WINDOWS" ] || [ "$SIGN_MACOS" = true ]; then
              sign=true
            else
              echo "::warning::signing is not configured (SIGN_AZURE_CLIENT_ID, APPLE_SIGNING); the programs stay unsigned"
            fi
          fi
          {
            echo "version=$version"
            echo "release=$release"
            echo "sign=$sign"
            echo "sha=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "v$version, release: $release, sign: $sign" | tee -a "$GITHUB_STEP_SUMMARY"

  test:
    name: Test ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.platforms) }}
    steps:
      - uses: actions/checkout@v7

      - uses: randyos-org/setup-zig@node24  # v2.2.1 on Node.js 24, until upstream releases it
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build

      - name: Unit tests
        run: zig build test

      - name: The binary runs
        run: ./zig-out/bin/skein version

      # skein checks itself: its own requirements, and the tests that cite them
      - name: skein check, on skein
        run: |
          ./zig-out/bin/skein check
          ./zig-out/bin/skein coverage --profile implemented

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: randyos-org/setup-zig@node24  # v2.2.1 on Node.js 24, until upstream releases it
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: zig fmt
        run: zig fmt --check build build.zig src templates tools

      - name: Markdown
        run: npx --yes markdownlint-cli2@0.24.2 "**/*.md"

  # Skein's own action (action.yml, #266) on a project from a template: the
  # controlled documents printed to PDF and zipped, with the skein just built
  engineering-docs:
    name: Engineering documents
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: randyos-org/setup-zig@node24  # v2.2.1 on Node.js 24, until upstream releases it
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build skein, and start a project from a template
        run: |
          zig build
          mkdir -p "$RUNNER_TEMP/project"
          zig-out/bin/skein init --root "$RUNNER_TEMP/project" --template npr7123.1d
          cp -R "$RUNNER_TEMP/project" ./.engineering-docs-project

      - id: docs
        uses: ./
        with:
          root: .engineering-docs-project
          skein: zig-out/bin/skein
          name: engineering-docs-test

      - name: The archive holds the documents as PDFs
        env:
          ARCHIVE: ${{ steps.docs.outputs.archive }}
        run: |
          unzip -l "$ARCHIVE"
          n=$(unzip -l "$ARCHIVE" | grep -c '\.pdf$')
          [ "$n" -ge 3 ] || { echo "::error::$n PDFs in the archive"; exit 1; }
          unzip -p "$ARCHIVE" documents.tsv | grep -q 'SE-PLAN' || { echo "::error::documents.tsv lists no SE-PLAN"; exit 1; }

  # The VS Code extension's TypeScript: its types, its unit tests, and its
  # packages kept free of known vulnerabilities
  extension:
    name: Extension
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: npm ci --no-fund

      - name: Audit
        run: npm audit

      - name: Types
        run: npm run typecheck

      - name: Unit tests
        run: npm run unit

      - name: Bundle
        run: npm run build

  # skein for each platform, built on one runner (Zig compiles for all of
  # them), unsigned: out/skein-vVERSION-TARGET/ with bin/, the license and the
  # readme, as a tar (which keeps the execute bits). The sign-* jobs sign the
  # programs in it; package archives them.
  compile:
    name: Compile
    needs: [changes, version]
    if: needs.changes.outputs.ci == 'true' && needs.changes.outputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: randyos-org/setup-zig@node24  # v2.2.1 on Node.js 24, until upstream releases it
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: skein for each platform
        run: |
          # the Linux programs are static (musl), so they run on any distribution
          for target in x86_64-linux-musl aarch64-linux-musl x86_64-macos aarch64-macos x86_64-windows aarch64-windows; do
            name="skein-v$VERSION-${target%-musl}"
            zig build -Dtarget="$target" -Doptimize=ReleaseSafe --prefix "out/$name"
            cp LICENSE readme.md "out/$name/"
          done
          tar -C out -cf unsigned.tar .
          tar -tvf unsigned.tar

      - uses: actions/upload-artifact@v7
        with:
          name: unsigned
          path: unsigned.tar
          if-no-files-found: error

  # Azure Artifact Signing, through the Entra identity whose federated
  # credential trusts this repository's main (and a branch while a signing
  # change is tested); skipped while SIGN_AZURE_CLIENT_ID is unset
  sign-windows:
    name: Sign skein.exe
    needs: [version, compile]
    if: ${{ !cancelled() && needs.compile.result == 'success' && needs.version.outputs.sign == 'true' && vars.SIGN_AZURE_CLIENT_ID != '' }}
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: unsigned

      - name: Unpack the Windows programs
        run: |
          mkdir pkg
          tar -C pkg -xf unsigned/unsigned.tar --wildcards "./skein-v*-windows/*"
          ls pkg

      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.SIGN_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.SIGN_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.SIGN_AZURE_SUBSCRIPTION_ID }}

      # SHA-256 and a trusted timestamp: the certificates last 3 days, the
      # signature must stay valid after
      - name: Sign skein.exe
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.SIGN_ENDPOINT }}
          signing-account-name: ${{ vars.SIGN_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGN_PROFILE }}
          files-folder: ${{ github.workspace }}\pkg
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify the signatures
        shell: pwsh
        run: |
          $exes = @(Get-ChildItem pkg -Recurse -Filter skein.exe)
          if ($exes.Count -ne 2) { throw "expected 2 skein.exe, found $($exes.Count)" }
          foreach ($exe in $exes) {
            $sig = Get-AuthenticodeSignature $exe.FullName
            "$($exe.FullName): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "$($exe.FullName) is not validly signed: $($sig.Status)" }
            if ($null -eq $sig.TimeStamperCertificate) { throw "$($exe.FullName) has no timestamp" }
          }

      - name: The signed skein.exe runs (x86_64)
        run: pkg/skein-v*-x86_64-windows/bin/skein.exe version

      - name: Stage the signed programs
        run: tar -C pkg -cf signed-windows.tar .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-windows
          path: signed-windows.tar
          if-no-files-found: error

  # The Developer ID, a hardened runtime and a secure timestamp, then Apple's
  # notarization; skipped while the variable APPLE_SIGNING is not true
  sign-macos:
    name: Sign and notarize the macOS skein
    needs: [version, compile]
    if: ${{ !cancelled() && needs.compile.result == 'success' && needs.version.outputs.sign == 'true' && vars.APPLE_SIGNING == 'true' }}
    runs-on: macos-15
    timeout-minutes: 120
    env:
      APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
      APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: unsigned

      - name: Unpack the macOS programs
        run: |
          mkdir pkg
          tar -C pkg -xf unsigned/unsigned.tar --include "./skein-v*-macos/*"
          ls pkg

      - name: Import the Developer ID certificate
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass=$(uuidgen)
          echo "$APPLE_DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$keychain"

      # skein needs no entitlements
      - name: Sign
        run: |
          identity=$(security find-identity -v -p codesigning | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          [ -n "$identity" ] || { echo "::error::no Developer ID Application identity"; exit 1; }
          for exe in pkg/*/bin/skein; do
            codesign --force --options runtime --timestamp --sign "$identity" "$exe"
            codesign --verify --strict --verbose=2 "$exe"
          done

      # A bare executable cannot be stapled: Gatekeeper looks the ticket up
      # online. notarytool takes a zip.
      - name: Notarize
        run: |
          echo "$APPLE_NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          auth=(--key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID")
          ids=()
          for dir in pkg/*/; do
            name=$(basename "$dir")
            ditto -c -k --keepParent "$dir/bin/skein" "$RUNNER_TEMP/$name.zip"
            id=$(xcrun notarytool submit "$RUNNER_TEMP/$name.zip" --no-wait --output-format json "${auth[@]}" | jq -r .id)
            echo "$name: submission $id"
            ids+=("$id")
          done
          failed=0
          for id in "${ids[@]}"; do
            xcrun notarytool wait "$id" --timeout 90m --output-format json "${auth[@]}" > "$RUNNER_TEMP/result.json" || true
            status=$(jq -r '.status // "no answer"' "$RUNNER_TEMP/result.json")
            echo "submission $id: $status"
            if [ "$status" != Accepted ]; then
              xcrun notarytool log "$id" "${auth[@]}" || true
              failed=1
            fi
          done
          rm "$RUNNER_TEMP/notary.p8"
          exit "$failed"

      - name: Verify the signatures
        run: |
          for exe in pkg/*/bin/skein; do
            codesign --verify --strict "$exe"
            codesign -dv --verbose=2 "$exe" 2>&1 | grep -E "Authority|flags|Timestamp"
          done

      - name: The signed skein runs
        run: |
          pkg/skein-v*-aarch64-macos/bin/skein version
          arch -x86_64 pkg/skein-v*-x86_64-macos/bin/skein version || echo "::warning::the x86_64 skein did not run here (Rosetta?)"

      - name: Stage the signed programs
        run: tar -C pkg -cf signed-macos.tar .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-macos
          path: signed-macos.tar
          if-no-files-found: error

  # A universal skein in a signed, notarized and stapled installer package
  # (Developer ID Installer), installed into /usr/local; skipped while the
  # variable APPLE_PKG is not true
  pkg-macos:
    name: macOS installer package
    needs: [version, sign-macos]
    if: ${{ !cancelled() && needs.sign-macos.result == 'success' && vars.APPLE_PKG == 'true' }}
    runs-on: macos-15
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
      APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_INSTALLER_P12: ${{ secrets.APPLE_INSTALLER_P12 }}
      APPLE_INSTALLER_P12_PASSWORD: ${{ secrets.APPLE_INSTALLER_P12_PASSWORD }}
      APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-macos
          path: signed

      - name: Import the certificates
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass=$(uuidgen)
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          for kind in DEVELOPER_ID INSTALLER; do
            p12="APPLE_${kind}_P12"
            pw="APPLE_${kind}_P12_PASSWORD"
            echo "${!p12}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -P "${!pw}" -A -t cert -f pkcs12 -k "$keychain"
            rm "$RUNNER_TEMP/cert.p12"
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$pass" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security find-identity -v

      # One universal skein (lipo of the two signed programs, signed again)
      - name: Build the universal program and the installer
        run: |
          app=$(security find-identity -v | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          inst=$(security find-identity -v | sed -n 's/.*"\(Developer ID Installer:.*\)"/\1/p' | head -1)
          [ -n "$app" ] && [ -n "$inst" ] || { echo "::error::an identity is missing"; exit 1; }
          mkdir pkg
          tar -C pkg -xf signed/signed-macos.tar
          root="$RUNNER_TEMP/root"
          mkdir -p "$root/usr/local/bin" "$root/usr/local/share/doc/skein"
          lipo -create pkg/skein-v*-x86_64-macos/bin/skein pkg/skein-v*-aarch64-macos/bin/skein -output "$root/usr/local/bin/skein"
          lipo -info "$root/usr/local/bin/skein"
          codesign --force --options runtime --timestamp --sign "$app" "$root/usr/local/bin/skein"
          cp pkg/skein-v*-aarch64-macos/LICENSE "$root/usr/local/share/doc/skein/"
          pkgbuild --root "$root" --identifier com.github.chasingdaylight.skein --version "$VERSION" \
            --install-location / "$RUNNER_TEMP/skein-component.pkg"
          mkdir out
          productbuild --package "$RUNNER_TEMP/skein-component.pkg" --sign "$inst" --timestamp \
            "out/skein-v$VERSION-macos.pkg"
          pkgutil --check-signature "out/skein-v$VERSION-macos.pkg"

      - name: Notarize and staple the installer
        run: |
          echo "$APPLE_NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          auth=(--key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID")
          pkg="out/skein-v$VERSION-macos.pkg"
          xcrun notarytool submit "$pkg" --wait --timeout 90m --output-format json "${auth[@]}" > "$RUNNER_TEMP/result.json" || true
          status=$(jq -r '.status // "no answer"' "$RUNNER_TEMP/result.json")
          echo "notarization: $status"
          if [ "$status" != Accepted ]; then
            xcrun notarytool log "$(jq -r .id "$RUNNER_TEMP/result.json")" "${auth[@]}" || true
            exit 1
          fi
          rm "$RUNNER_TEMP/notary.p8"
          xcrun stapler staple "$pkg"
          xcrun stapler validate "$pkg"

      - name: The installer is accepted and its skein runs
        run: |
          pkg="out/skein-v$VERSION-macos.pkg"
          spctl --assess --type install -vv "$pkg"
          pkgutil --expand-full "$pkg" "$RUNNER_TEMP/expanded"
          exe=$(find "$RUNNER_TEMP/expanded" -path '*usr/local/bin/skein' | head -1)
          "$exe" version
          arch -x86_64 "$exe" version || echo "::warning::the x86_64 slice did not run here (Rosetta?)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-pkg
          path: out/*.pkg
          if-no-files-found: error

  # What a release publishes: the archives of skein for each platform, signed
  # where a signing job ran, the macOS installer package when there is one,
  # and the VS Code extension's packages, made from the same programs.
  package:
    name: Package
    needs: [changes, version, compile, sign-windows, sign-macos, pkg-macos]
    # a signing job that was skipped (not asked for, or not configured)
    # leaves the programs unsigned; one that failed fails the run
    if: >-
      ${{ !cancelled() && needs.compile.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.sign-windows.result)
      && contains(fromJSON('["success","skipped"]'), needs.sign-macos.result)
      && contains(fromJSON('["success","skipped"]'), needs.pkg-macos.result) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
      WINDOWS: ${{ needs.sign-windows.result }}
      MACOS: ${{ needs.sign-macos.result }}
      PKG: ${{ needs.pkg-macos.result }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v8
        with:
          name: unsigned
          path: unsigned

      - uses: actions/download-artifact@v8
        if: env.WINDOWS == 'success' || env.MACOS == 'success'
        with:
          pattern: signed-*
          path: signed

      - uses: actions/download-artifact@v8
        if: env.PKG == 'success'
        with:
          name: macos-pkg
          path: macos-pkg

      # The signed programs replace the unsigned ones (a single matching
      # artifact is extracted into signed/ itself, several into a folder
      # each: find covers both). A signing job that succeeded must have its
      # programs used, or the release would ship unsigned ones.
      - name: The programs to package
        run: |
          mkdir out
          tar -C out -xf unsigned/unsigned.tar
          used=" "
          while IFS= read -r t; do
            tar -C out -xf "$t"
            used="$used$(basename "$t") "
          done < <(find signed -name 'signed-*.tar' 2> /dev/null)
          if [ "$WINDOWS" = success ]; then
            case "$used" in *" signed-windows.tar "*) ;; *) echo "::error::skein.exe was signed but its signed copies were not found"; exit 1 ;; esac
          fi
          if [ "$MACOS" = success ]; then
            case "$used" in *" signed-macos.tar "*) ;; *) echo "::error::the macOS skein was signed but its signed copies were not found"; exit 1 ;; esac
          fi
          echo "signed: windows $WINDOWS, macOS $MACOS"

      - name: The archives
        run: |
          mkdir -p dist
          for dir in out/skein-v*/; do
            name=$(basename "$dir")
            case "$name" in
              *windows) (cd out && zip -q -r "../dist/$name.zip" "$name") ;;
              *) tar -C out -czf "dist/$name.tar.gz" "$name" ;;
            esac
          done
          if [ "$PKG" = success ]; then cp macos-pkg/*.pkg dist/; fi
          ls -l dist

      - name: The program for this runner runs
        run: |
          tar -C "$RUNNER_TEMP" -xzf "dist/skein-v$VERSION-x86_64-linux.tar.gz"
          test "$("$RUNNER_TEMP/skein-v$VERSION-x86_64-linux/bin/skein" version)" = "$VERSION"

      # One package per platform, each with the skein built for it in bin/,
      # and the universal one, without a program, for the platforms that
      # have none. Alpine takes the Linux program, which is static. They are
      # pre-releases; the mark is set here, since the registries read it
      # from the package. The extension's code is bundled into
      # dist/extension.js (vscode:prepublish), so no node_modules go in.
      - name: The VS Code extension
        working-directory: editors/vscode
        run: |
          npm ci --no-fund
          vsce() { npx --yes "@vscode/vsce@$VSCE_VERSION" "$@" --no-dependencies; }
          while read -r platform target; do
            rm -rf bin
            mkdir bin
            cp "$GITHUB_WORKSPACE/out/skein-v$VERSION-$target/bin/"skein* bin/
            rm -f bin/*.pdb
            vsce package --pre-release --target "$platform" \
              --out "$GITHUB_WORKSPACE/dist/skein-vscode-v$VERSION-$platform.vsix"
          done << 'EOF'
          win32-x64 x86_64-windows
          win32-arm64 aarch64-windows
          linux-x64 x86_64-linux
          linux-arm64 aarch64-linux
          alpine-x64 x86_64-linux
          alpine-arm64 aarch64-linux
          darwin-x64 x86_64-macos
          darwin-arm64 aarch64-macos
          EOF
          rm -rf bin
          vsce package --pre-release \
            --out "$GITHUB_WORKSPACE/dist/skein-vscode-v$VERSION-universal.vsix"
          ls -l "$GITHUB_WORKSPACE"/dist/*.vsix

      # the program is in the package for this runner, and can be run
      - name: The packaged program runs
        run: |
          mkdir "$RUNNER_TEMP/vsix"
          unzip -q "dist/skein-vscode-v$VERSION-linux-x64.vsix" -d "$RUNNER_TEMP/vsix"
          test "$("$RUNNER_TEMP/vsix/extension/bin/skein" version)" = "$VERSION"
          test -f "$RUNNER_TEMP/vsix/extension/dist/extension.js"
          if unzip -l "dist/skein-vscode-v$VERSION-linux-x64.vsix" | grep -q 'node_modules/'; then
            echo "::error::the package carries node_modules"
            exit 1
          fi
          if unzip -l "dist/skein-vscode-v$VERSION-universal.vsix" | grep -q 'extension/bin/'; then
            echo "::error::the universal package carries a program"
            exit 1
          fi

      # a signing that succeeded must be what ships, in the archives and the
      # VS Code packages
      - name: The Windows packages carry the signed skein.exe
        if: env.WINDOWS == 'success'
        run: |
          t=$(find signed -name signed-windows.tar)
          for p in win32-x64:x86_64-windows win32-arm64:aarch64-windows; do
            target=${p#*:}
            tar -xOf "$t" "./skein-v$VERSION-$target/bin/skein.exe" > "$RUNNER_TEMP/signed.exe"
            unzip -p "dist/skein-vscode-v$VERSION-${p%%:*}.vsix" extension/bin/skein.exe | cmp - "$RUNNER_TEMP/signed.exe"
            unzip -p "dist/skein-v$VERSION-$target.zip" "skein-v$VERSION-$target/bin/skein.exe" | cmp - "$RUNNER_TEMP/signed.exe"
            echo "$target: the signed skein.exe"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error

  ci:
    name: CI
    # the one check main's ruleset requires: passes when every job passed or
    # was skipped for a change that needs none
    if: always()
    needs: [changes, version, test, lint, engineering-docs, extension, compile, sign-windows, sign-macos, pkg-macos, package]
    runs-on: ubuntu-24.04
    steps:
      - name: Check the jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success | skipped) ;; *) echo "::error::a job ended as $r"; exit 1 ;; esac
          done

  release:
    name: Release v${{ needs.version.outputs.version }}
    needs: [version, test, lint, package]
    if: >-
      ${{ !cancelled() && needs.version.outputs.release == 'true'
      && needs.test.result == 'success' && needs.lint.result == 'success'
      && needs.package.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Check the packages
        run: |
          ls -l dist
          for f in x86_64-linux.tar.gz aarch64-linux.tar.gz x86_64-macos.tar.gz aarch64-macos.tar.gz x86_64-windows.zip aarch64-windows.zip; do
            if [ ! -f "dist/skein-v$VERSION-$f" ]; then
              echo "::error::no skein-v$VERSION-$f"
              exit 1
            fi
          done
          for p in universal win32-x64 win32-arm64 linux-x64 linux-arm64 alpine-x64 alpine-arm64 darwin-x64 darwin-arm64; do
            if [ ! -f "dist/skein-vscode-v$VERSION-$p.vsix" ]; then
              echo "::error::no $p VS Code extension package at version $VERSION"
              exit 1
            fi
          done

      - name: Tag the tested commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "skein v$VERSION" "$SHA"
          git push origin "v$VERSION"
          (cd dist && sha256sum -- * > SHA256SUMS)

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: skein v${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
          # 0.x: everything may still change
          prerelease: ${{ startsWith(needs.version.outputs.version, '0.') }}

  # The next version is begun on dev: main keeps the version it released. A
  # separate job, so that a push dev refuses does not stop the publishing.
  begin-next-version:
    name: Merge v${{ needs.version.outputs.version }} into dev and begin the next version
    needs: [version, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      # A fast-forward when dev has not moved, else a merge commit
      - name: Merge into dev and begin the next version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tagged() { git rev-parse -q --verify "refs/tags/v$1" >/dev/null; }
          for attempt in 1 2 3; do
            git fetch -q --tags origin dev
            git checkout -q -B dev origin/dev
            if ! git merge -q -m "Merge v$VERSION into dev [skip ci]" "$SHA"; then
              git merge --abort
              echo "::error::v$VERSION conflicts with dev; merge main into dev by hand and set the next version"
              exit 1
            fi
            version=$(sed -nE 's/^\s*\.version = "([^"]+)",/\1/p' build.zig.zon)
            if tagged "$version"; then
              next=$version
              while tagged "$next"; do
                IFS=. read -r ma mi pa <<< "$next"
                next="$ma.$mi.$((pa + 1))"
              done
              # every place that states the version, the lock file too
              bash .github/workflows/version.sh set "$next"
              git commit -qam "Begin v$next development [skip ci]"
            fi
            if git push -q origin dev; then exit 0; fi
            echo "dev moved while merging; trying again"
          done
          echo "::error::could not push to dev"
          exit 1

  publish-extension:
    name: Publish VS Code extension v${{ needs.version.outputs.version }}
    needs: [version, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Each registry has its own workflow, which takes the package from the
    # release: open-vsx.yml, the workflow Open VSX trusts by name, and
    # marketplace.yml, the one the Marketplace's Trusted Publishing policy
    # names. Both can also be run by hand for any released version.
    permissions:
      actions: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Start publishing to Open VSX and the Marketplace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in open-vsx.yml marketplace.yml; do
            gh workflow run "$wf" --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f version="$VERSION"
          done
