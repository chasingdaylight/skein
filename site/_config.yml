      - title: The forge
        url: /forge.html
      - title: Other repositories
        url: /repositories.html
      - title: Test results
        url: /results.html
      - title: Templates
        url: /templates.html
      - title: Importing
        url: /importing.html
  - title: Skein itself
    children:
      - title: Design
