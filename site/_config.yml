# The documentation site: docs/ as pages, built by GitHub Pages' own Jekyll
# until Skein renders HTML itself. tools/site.sh puts this directory, docs/
# and the rendered requirements together.
#
# No `url` and no absolute links: the same site is served under more than one
# domain, and a page must not load or link to anything on another one.
title: Skein
description: Requirements, specifications and traceability as plain text in git.
repository_url: https://github.com/chasingdaylight/skein

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter_opts:
    disable: true

plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-titles-from-headings
  - jekyll-readme-index

relative_links:
  enabled: true
  collections: false

titles_from_headings:
  enabled: true
  strip_title: false
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: default

nav:
  - title: Overview
    url: /
  - title: Quickstart
    url: /quickstart.html
  - title: "Tutorial: NPR 7150.2D"
    url: /tutorial-npr7150.html
  - title: "Tutorial: existing code"
    url: /tutorial-existing-code.html
  - title: "Tutorial: planning"
    url: /tutorial-planning.html
  - title: Examples
    url: /examples.html
  - title: Writing items
    url: /writing-items.html
  - title: Project files
    url: /project-files.html
  - title: The web interface
    url: /web.html
  - title: Commands
    url: /commands.html
  - title: Reviewing
    url: /reviewing.html
  - title: Other repositories
    url: /repositories.html
  - title: Test results
    url: /results.html
  - title: The forge
    url: /forge.html
  - title: Templates
    url: /templates.html
  - title: Importing
    url: /importing.html
  - title: Design
    url: /design.html
  - title: Requirements
    url: /requirements/
