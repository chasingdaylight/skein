<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">skein</title>
  <defs>
    <g id="note-marks" fill="none" stroke="#000" stroke-opacity="0.28" stroke-width="5" stroke-linecap="round">
      <path d="M16,44 H94"/>
      <path d="M16,62 H86"/>
      <path d="M16,80 H64"/>
    </g>
    <g id="pin">
      <circle r="10" fill="#1f2a44"/>
      <circle cx="-3" cy="-3" r="3" fill="#fff" fill-opacity="0.7"/>
    </g>
    <!-- one turn of the twisted hank -->
    <g id="turn">
      <ellipse rx="46" ry="66" fill="#c8102e" stroke="#7a0a1c" stroke-width="4"/>
      <g fill="none" stroke="#8f0b21" stroke-width="2.5">
        <ellipse rx="36" ry="65"/>
        <ellipse rx="26" ry="65"/>
        <ellipse rx="16" ry="65"/>
        <ellipse rx="6" ry="65"/>
      </g>
      <g fill="none" stroke="#ec5a6f" stroke-width="2">
        <ellipse rx="31" ry="65"/>
        <ellipse rx="21" ry="65"/>
        <ellipse rx="11" ry="65"/>
      </g>
    </g>
    <g id="end-loop" fill="none">
      <ellipse rx="24" ry="15" stroke="#7a0a1c" stroke-width="20"/>
      <ellipse rx="24" ry="15" stroke="#c8102e" stroke-width="11"/>
      <ellipse rx="24" ry="15" stroke="#ec5a6f" stroke-width="2"/>
    </g>
  </defs>

  <!-- board -->
  <rect x="16" y="16" width="480" height="480" rx="72" fill="#d6a565" stroke="#7a4e24" stroke-width="20"/>
  <g fill="#b98848">
    <circle cx="208" cy="64" r="4"/>
    <circle cx="262" cy="98" r="3"/>
    <circle cx="300" cy="52" r="3"/>
    <circle cx="470" cy="210" r="4"/>
    <circle cx="452" cy="286" r="3"/>
    <circle cx="48" cy="212" r="3"/>
    <circle cx="66" cy="272" r="4"/>
    <circle cx="218" cy="452" r="4"/>
    <circle cx="286" cy="430" r="3"/>
    <circle cx="322" cy="468" r="3"/>
    <circle cx="196" cy="140" r="3"/>
    <circle cx="330" cy="396" r="3"/>
  </g>

  <!-- notes -->
  <g transform="translate(62,58) rotate(-6)">
    <rect x="4" y="6" width="110" height="110" fill="#000" fill-opacity="0.2"/>
    <rect width="110" height="110" fill="#ffe066"/>
    <use xlink:href="#note-marks" href="#note-marks"/>
  </g>
  <g transform="translate(334,50) rotate(5)">
    <rect x="4" y="6" width="110" height="110" fill="#000" fill-opacity="0.2"/>
    <rect width="110" height="110" fill="#ff9ec4"/>
    <use xlink:href="#note-marks" href="#note-marks"/>
  </g>
  <g transform="translate(352,338) rotate(-4)">
    <rect x="4" y="6" width="110" height="110" fill="#000" fill-opacity="0.2"/>
    <rect width="110" height="110" fill="#8fd3f4"/>
    <use xlink:href="#note-marks" href="#note-marks"/>
  </g>
  <g transform="translate(52,344) rotate(7)">
    <rect x="4" y="6" width="110" height="110" fill="#000" fill-opacity="0.2"/>
    <rect width="110" height="110" fill="#b5e48c"/>
    <use xlink:href="#note-marks" href="#note-marks"/>
  </g>

  <!-- yarn between the pins -->
  <g fill="none" stroke="#c8102e" stroke-width="6" stroke-linecap="round">
    <path d="M118.2,66.2 L387.6,68.7"/>
    <path d="M387.6,68.7 L407.8,348.1"/>
    <path d="M407.8,348.1 L104.9,364.6"/>
    <path d="M104.9,364.6 L118.2,66.2"/>
    <path d="M118.2,66.2 L407.8,348.1"/>
  </g>

  <!-- skein: a twisted hank -->
  <g transform="translate(264,276) rotate(-20) scale(1.05)">
    <ellipse rx="160" ry="62" fill="#000" fill-opacity="0.28"/>
  </g>
  <path d="M412,200 C452,176 442,118 387.6,68.7" fill="none" stroke="#c8102e" stroke-width="6" stroke-linecap="round"/>
  <g transform="translate(256,262) rotate(-20) scale(1.05)">
    <use xlink:href="#end-loop" href="#end-loop" x="-146"/>
    <use xlink:href="#end-loop" href="#end-loop" x="146"/>
    <use xlink:href="#turn" href="#turn" transform="translate(-92,0) rotate(32) scale(0.82)"/>
    <use xlink:href="#turn" href="#turn" transform="translate(-46,0) rotate(32) scale(0.98)"/>
    <use xlink:href="#turn" href="#turn" transform="translate(0,0) rotate(32) scale(1.06)"/>
    <use xlink:href="#turn" href="#turn" transform="translate(46,0) rotate(32) scale(0.98)"/>
    <use xlink:href="#turn" href="#turn" transform="translate(92,0) rotate(32) scale(0.82)"/>
  </g>

  <!-- pins -->
  <use xlink:href="#pin" href="#pin" x="118.2" y="66.2"/>
  <use xlink:href="#pin" href="#pin" x="387.6" y="68.7"/>
  <use xlink:href="#pin" href="#pin" x="407.8" y="348.1"/>
  <use xlink:href="#pin" href="#pin" x="104.9" y="364.6"/>
</svg>
